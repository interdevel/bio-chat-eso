<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat de Biología con IA para E.S.O.</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col items-center p-10">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">💬 Chat Simple con IA</h1>
    
    <div id="chat-box" class="w-full max-w-md bg-white p-4 rounded-lg shadow-md h-80 overflow-y-auto mb-4 border border-gray-200">
        <p class="text-gray-500 italic text-sm">Escribe tu pregunta y presiona Enviar...</p>
    </div>

    <div class="flex gap-2 w-full max-w-md">
        <input type="text" id="userInput" class="flex-1 p-2 border rounded" placeholder="Escribe tu pregunta aquí...">
        <button onclick="enviarPregunta()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Enviar</button>
    </div>

    <script>
        async function enviarPregunta() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const userText = input.value;
            
            if (!userText.trim()) return; // No enviar preguntas vacías
            
            // Mostrar la pregunta en pantalla
            chatBox.innerHTML += `<p class="text-blue-700"><strong>Tú:</strong> ${userText}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight; // Desplazar al final del chat
            
            // Llamar a nuestro archivo PHP
            try {
                const response = await fetch('chat.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: userText })
                });
                
                const data = await response.json();
                
                // Mostrar la respuesta de la IA
                chatBox.innerHTML += `<p class="mt-2 text-gray-900"><strong>IA:</strong> ${data.response}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight; // Desplazar al final del chat
                
            } catch (error) {
                console.error('Error al comunicarse con el servidor:', error);
                chatBox.innerHTML += `<p class="mt-2 text-red-600"><strong>Error:</strong> No se pudo obtener respuesta de la IA.</p>`;
                 chatBox.scrollTop = chatBox.scrollHeight; // Desplazar al final del chat
            }
            
            input.value = ''; // Limpiar input
        }
    </script>
</body>
</html>
